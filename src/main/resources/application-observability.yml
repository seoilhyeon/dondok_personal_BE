# Local-only profile for the Compose observability baseline.
management:
  endpoints:
    web:
      base-path: /api/actuator
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
      group:
        readiness:
          include: readinessState,db,s3
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
